{
  "schema": "enki-runtime-desired-state/v1",
  "companySlug": "enki-hogar-ai-os",
  "packageVersion": "0.6.0",
  "mode": "governed-publishing",
  "rejectUnexpectedActiveConnections": true,
  "rejectUnexpectedAgents": true,
  "rejectUnexpectedProfiles": true,
  "rejectUnexpectedPolicies": true,
  "rejectUnexpectedGateways": true,
  "rejectUnexpectedGatewayProfileBindings": true,
  "rejectPersistentGatewayTokens": true,
  "rejectUnexpectedRoutines": true,
  "requirePositiveMonthlyBudget": true,
  "requirePositiveCompanyMonthlyBudget": true,
  "plugins": [
    {
      "key": "telegram_gateway",
      "pluginId": "enki-hogar.telegram-gateway",
      "version": "0.2.0",
      "installation": "instance_local_path",
      "containerPath": "/plugins/enki-telegram-gateway",
      "companyConfigEnabled": true,
      "transport": "telegram_long_polling",
      "secretConfigFields": ["botToken"],
      "requireExactSenderAndChatAllowlists": true,
      "requireActiveHumanAttribution": true,
      "approvalDecisions": "ui_only",
      "requiredCapabilities": [
        "issues.read",
        "issues.create",
        "issues.wakeup",
        "issue.comments.read",
        "issue.comments.create",
        "issue.comments.create_human_attributed",
        "agents.read",
        "access.members.read",
        "events.subscribe",
        "plugin.state.read",
        "plugin.state.write",
        "secrets.read-ref",
        "http.outbound",
        "ui.dashboardWidget.register"
      ],
      "forbiddenCapabilities": [
        "approvals.respond",
        "issue.interactions.respond",
        "agents.invoke",
        "agents.resume",
        "issues.update"
      ]
    }
  ],
  "agentRuntime": {
    "adapterType": "codex_local",
    "engine": "cli",
    "model": "gpt-5.6-sol",
    "dangerouslyBypassApprovalsAndSandbox": false,
    "skipGitRepoCheck": true,
    "sandbox": "read-only",
    "permissionProfile": "enki-readonly-network",
    "permissionProfileExtends": ":read-only",
    "approvalPolicy": "never",
    "managedMcpDefaultToolsApprovalMode": "approve",
    "networkAccess": true,
    "useLegacyLandlock": true,
    "heartbeatEnabled": false,
    "maxConcurrentRuns": 1,
    "managedMcpOnly": true,
    "requireUniqueManagedCodexHome": true,
    "requireEmptyOpenAiApiKey": true
  },
  "connections": [
    {
      "key": "woocommerce",
      "name": "Enki WooCommerce Read Only",
      "transport": "mcp_remote",
      "authKind": "api_key",
      "endpoint": "http://enki-woocommerce-mcp:8020/mcp",
      "requiredCredential": {"placement": "header", "key": "Authorization", "prefix": "Bearer "},
      "status": "active",
      "enabled": true,
      "healthStatus": "ok",
      "strictCatalog": true,
      "tools": [
        "woo_sales_summary",
        "woo_orders_summary",
