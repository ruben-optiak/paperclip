  "routines": [
    {
      "key": "daily-operating-brief",
      "title": "Brief laboral diario",
      "status": "paused",
      "concurrencyPolicy": "coalesce_if_active",
      "catchUpPolicy": "skip_missed",
      "strictTriggers": true,
      "triggers": [
        {
          "kind": "schedule",
          "enabled": false,
          "cronExpression": "0 8 * * 1-5",
          "timezone": "Europe/Madrid"
        }
      ]
    },
    {
      "key": "weekly-operating-review",
      "title": "Revisión operativa semanal",
      "status": "paused",
      "concurrencyPolicy": "coalesce_if_active",
      "catchUpPolicy": "skip_missed",
      "strictTriggers": true,
