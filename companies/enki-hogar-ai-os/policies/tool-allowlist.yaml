schema: enki-tool-policy/v1
default: quarantine
connectors:
  woocommerce:
    allowed:
      woo_sales_summary: read
      woo_orders_summary: read
      woo_get_product: read
      woo_get_product_structure: read
      woo_low_stock: read
      woo_catalog_summary: read
    deniedPatterns: [create, update, delete, refund, batch, customer, set, write]
  google_ads:
    allowed:
      customers_list_accessible_customers: read
      search_search: read
      metadata_get_resource_metadata: read
    deniedPatterns: [mutate, create, update, delete, upload, budget]
  google_analytics:
    allowed:
      get_account_summaries: read
      get_property_details: read
      run_report: read
      run_funnel_report: read
      get_custom_dimensions_and_metrics: read
      run_realtime_report: read
    deniedPatterns: [create, update, delete, archive, mutate]
  google_search_console:
    allowed:
      gsc_list_sites: read
      gsc_search_analytics: read
      gsc_inspect_url: read
      gsc_list_sitemaps: read
    deniedPatterns: [index, submit, create, update, delete]
  product_support_knowledge:
    allowed:
      knowledge_resolve_product: read
      knowledge_get_technical_profile: read
      knowledge_check_compatibility: read
      knowledge_list_allowed_options: read
      knowledge_get_configuration_model: read
      knowledge_search_support: read
      knowledge_get_evidence: read
      knowledge_coverage: read
    deniedPatterns: [create, update, delete, archive, restore, purge, import, reindex, write]
  wordpress:
    allowed:
      render: local-draft
      sync_dry_run: local-draft
    deniedPatterns: [publish, create, update, delete, upload, schedule, credential, direct_api]
  content_publisher:
    allowed:
      publisher_get_capabilities: read
      wordpress_list_posts: read
      wordpress_get_article: read
      facebook_list_page_posts: read
      instagram_list_media: read
      instagram_get_publishing_limit: read
    askFirst:
      wordpress_upsert_post: write
      facebook_publish_page_post: write
      instagram_publish_image: write
    deniedPatterns: [delete, comment, message, dm, account, bulk, plugin, page, upload_media, reel, story, carousel]
