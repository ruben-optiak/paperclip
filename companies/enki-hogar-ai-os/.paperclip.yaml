schema: paperclip/v1
schemaVersion: 7
agents:
  director-operaciones:
    role: ceo
    adapter:
      type: codex_local
      config:
        engine: cli
        model: gpt-5.6-sol
        dangerouslyBypassApprovalsAndSandbox: false
        extraArgs:
          - --sandbox
          - workspace-write
          - -c
          - approval_policy="never"
          - -c
          - sandbox_workspace_write.network_access=true
    runtime:
      managedMcpOnly: true
      heartbeat:
        enabled: false
        maxConcurrentRuns: 1
    permissions:
      canCreateAgents: false
