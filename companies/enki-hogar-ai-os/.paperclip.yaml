tasks:
  daily-operating-brief:
    status: backlog
    priority: high
  weekly-operating-review:
    status: backlog
    priority: high
routines:
  daily-operating-brief:
    concurrencyPolicy: coalesce_if_active
    catchUpPolicy: skip_missed
    triggers:
      - kind: schedule
        label: Laborables a las 08:00 Europe/Madrid
        enabled: false
        cronExpression: "0 8 * * 1-5"
        timezone: Europe/Madrid
  weekly-operating-review:
    concurrencyPolicy: coalesce_if_active
    catchUpPolicy: skip_missed
    triggers:
      - kind: schedule
        label: Lunes a las 09:00 Europe/Madrid
        enabled: false
        cronExpression: "0 9 * * 1"
        timezone: Europe/Madrid
