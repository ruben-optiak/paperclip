schema: paperclip/v1
schemaVersion: 7
agents:
  director-optiak:
    role: ceo
    adapter:
      type: codex_local
      config:
        engine: cli
        model: gpt-5.6-sol
        dangerouslyBypassApprovalsAndSandbox: false
        extraArgs:
          - --skip-git-repo-check
          - -c
          - approval_policy="never"
          - -c
          - default_permissions="optiak-review-network"
          - -c
          - "permissions.optiak-review-network.extends=\":read-only\""
          - -c
          - permissions.optiak-review-network.network.enabled=true
          - -c
          - features.use_legacy_landlock=true
    runtime:
      managedMcpOnly: true
      heartbeat:
        enabled: false
        maxConcurrentRuns: 1
    permissions:
      canCreateAgents: false
