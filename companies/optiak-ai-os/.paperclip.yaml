tasks:
  public-docs-drift-review:
    status: backlog
    priority: high
  staging-golden-journey-smoke:
    status: backlog
    priority: high
  weekly-engineering-assurance-review:
    status: backlog
    priority: high
  weekly-architecture-health-review:
    status: backlog
    priority: medium
routines:
  public-docs-drift-review:
    concurrencyPolicy: coalesce_if_active
    catchUpPolicy: skip_missed
    triggers:
      - kind: schedule
        label: Weekdays at 08:30 Europe/Madrid
        enabled: false
        cronExpression: "30 8 * * 1-5"
        timezone: Europe/Madrid
  staging-golden-journey-smoke:
    concurrencyPolicy: coalesce_if_active
    catchUpPolicy: skip_missed
    triggers:
      - kind: schedule
        label: Weekdays at 09:00 Europe/Madrid
        enabled: false
        cronExpression: "0 9 * * 1-5"
        timezone: Europe/Madrid
  weekly-engineering-assurance-review:
    concurrencyPolicy: coalesce_if_active
    catchUpPolicy: skip_missed
    triggers:
      - kind: schedule
        label: Mondays at 10:00 Europe/Madrid
        enabled: false
        cronExpression: "0 10 * * 1"
        timezone: Europe/Madrid
  weekly-architecture-health-review:
    concurrencyPolicy: coalesce_if_active
    catchUpPolicy: skip_missed
    triggers:
      - kind: schedule
        label: Wednesdays at 11:00 Europe/Madrid
        enabled: false
        cronExpression: "0 11 * * 3"
        timezone: Europe/Madrid
