schema: optiak-desired-state/v1
version: 0.1.11
instance:
  isolation: separate_from_enki
  database: separate
  persistentStorage: separate
  secretStore: separate
agents:
  expected: 10
  importedPaused: true
  heartbeatSchedulesEnabled: false
routines:
  expected: 4
  importedPaused: true
budgets:
  companyMonthlyBilledCents: 15000
  agentMonthlyBilledCentsTotal: 10000
  warnPercent: 80
  hardStopPercent: 100
  monetaryEnforcementRequiresPricedEvents: true
  dailyRunCapsPortable: true
  timeoutSeconds: 300
connections:
  publicDocs:
    state: public_read_only
  roadmapBacklog:
    state: authorized_pending_oauth
    provider: Linear
    endpoint: https://mcp.linear.app/mcp/readonly
    workspace: optiak
    team: OPT
    initialInstallTargets:
      - product-prd-lead
    writes: deny
  gitProvider:
    state: authorized_pending_operator_credential
    provider: GitHub
    endpoint: https://api.githubcopilot.com/mcp/readonly
    authentication: fine_grained_personal_access_token
    initialInstallTargets:
      - independent-code-reviewer
    writes: deny
  repositories:
    state: authorized_allowlist_pending_connection
    default: deny
    allow:
      - optiak/optiak
      - optiak/optiak-frontend
  localTestUiApi:
    state: observed_reachability_only
    classification: non_production_candidate
    contract: skills/optiak-e2e-validation/references/test-environment-contract.json
    ui: reachable_http_only
    admin: healthy
    gateway: blocked_configuration_validation
    mcp: healthy_with_restart_history
    browser: disconnected
    tenant: unclassified
    writes: deny
    inference: deliberately_deferred_until_deployed_environment
    applicationCredential:
      configuredExpirationHours: 168
      revokeAtRunEnd: true
    reusableSyntheticApplication:
      retention: require_explicit_board_approval
      activeCredentialsAfterRun: 0
  stagingBrowserApi:
    state: disconnected
  observabilityAlerts:
    state: offline_contract_defined_connection_disconnected
    contract: skills/optiak-incident-triage/references/observability-source-contract.json
    automaticOncallCoverage: false
    aggregateAnalyticsFirst: true
    rawEvents: deny
    applicationLogs: deny_pending_structured_redaction_contract
    sessionReplay: deny
  production:
    state: disconnected
promotion:
  state: offline_contract_defined_not_deployed
  contract: skills/optiak-release-readiness/references/ai-os-promotion-contract.json
  infrastructureProvider: undecided
  directLocalToProduction: deny
  requiredValidationEnvironment: preproduction
  sameImmutableCandidateAcrossEnvironments: true
  importAgentsPaused: true
  importRoutineTriggersDisabled: true
  stageDecisionOwner: board
  evaluatorMayExecute: false
qualityContracts:
  architectureAuthority:
    state: offline_defined_sources_not_assumed_connected
    contract: skills/optiak-architecture-review/references/architecture-authority-map.json
  documentationAuthority:
    state: offline_defined_live_pages_remain_canonical
    contract: skills/optiak-docs-drift/references/documentation-authority-map.json
    wholeSiteSnapshots: deny
    publication: deny
  prdReadiness:
    state: offline_evaluator_ready
    contract: skills/optiak-prd-review/references/prd-readiness-contract.json
    evaluator: scripts/evaluate-prd-readiness.mjs
    readyVerdictAuthorizesImplementation: false
  postmortem:
    state: offline_evaluator_ready
    contract: skills/optiak-incident-triage/references/postmortem-contract.json
    evaluator: scripts/evaluate-postmortem.mjs
    evaluatorMayExecuteCorrectiveAction: false
autonomy:
  localFixturesAndDrafts: allow
  localCredentialFreeHealthReads: exact_loopback_only
  localAuthenticatedJourneys: deny_pending_contract_gates
  externalReads: source_scoped
  sandboxWrites: require_approval
  mergesDeploysRollbacks: deny
  productionMutation: deny
  secretAdministration: deny
sandbox:
  currentBackend: legacy_landlock
  targetBackend: bubblewrap
  migrationStatus: blocked
  controlPlanePrivilegeExpansion: deny
  compatibilityLock: runtime/compatibility.lock.json
