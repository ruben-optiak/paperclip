schema: optiak-tool-allowlist/v1
defaultDecision: quarantine
policy:
  productionMutation: deny
  merge: deny
  deploy: deny
  rollback: deny
  secretAdministration: deny
  infrastructureMutation: deny
  customerData: deny
reviewedCapabilities:
  - capability: public_docs_read
    decision: allow
    conditions:
      - record_url_and_retrieval_time
      - no_whole_site_snapshot
  - capability: product_backlog_read
    decision: allow_after_connection_smoke
    conditions:
      - official_linear_readonly_endpoint
      - workspace_optiak
      - team_OPT
      - product_prd_lead_only_initially
      - live_query_with_retrieval_time
      - bounded_item_reads_no_bulk_export
  - capability: product_backlog_mutation
    decision: deny
    conditions:
      - no_create
      - no_update
      - no_comment
      - no_assignment
      - no_archive_or_delete
      - no_admin
  - capability: local_fixture_read_write
    decision: allow
    conditions:
      - package_scoped
      - no_secrets
      - no_external_effect
  - capability: immutable_pr_read
    decision: allow_after_connection_smoke
    conditions:
      - official_github_remote_mcp_readonly_endpoint
      - repository_exactly_optiak_or_optiak_frontend
      - independent_code_reviewer_only_initially
      - exact_head_sha_resolved_and_rechecked
      - checks_match_exact_head_sha
      - bounded_reads_no_bulk_export
      - newly_discovered_tools_quarantined
  - capability: repository_branch_write
    decision: deny
  - capability: repository_issue_or_pr_mutation
    decision: deny
  - capability: staging_browser_read
    decision: pending_connection
  - capability: staging_synthetic_write
    decision: pending_connection_and_approval
  - capability: observability_read
    decision: pending_connection
  - capability: production_read
    decision: pending_connection
