  wholeSiteSnapshotsAllowed: false
  historicalEvidenceMustBeLabelled: true
  productAuthorityRef: skills/optiak-product-triage/references/product-authority.yaml
  repositoryAuthorityRef: skills/optiak-pr-review/references/repository-authority.yaml
