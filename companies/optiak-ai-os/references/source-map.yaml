futureAuthorities:
  - id: notion-product-engineering-knowledge
    status: connected_policy_smoke_passed_root_registry_pending
    provider: Notion
    authority: approved_intent_decisions_and_knowledge
    connectionEndpoint: https://mcp.notion.com/mcp
    policy: policies/notion-readonly.yaml
    installedFor:
      - director-optiak
      - engineering-assurance-lead
      - product-prd-lead
      - principal-platform-architect
      - senior-platform-engineer
      - independent-code-reviewer
      - reliability-incident-engineer
      - qa-e2e-validation-engineer
      - brand-ui-quality-reviewer
      - documentation-dx-steward
    restrictions:
      - oauth_inherits_authorizing_user_access
      - exact_ids_only_no_global_search
      - role_scoped_reads
      - no_whole_workspace_search_or_export
      - no_finance_legal_hr_board_private_personal_customer_or_secret_material
      - writes_denied_without_approval_override
      - changed_tools_quarantined
      - dedicated_restricted_identity_or_enforcing_proxy_before_activation
  - id: roadmap-backlog
    status: authorized_pending_connection
    provider: Linear
    url: https://linear.app/optiak/team/OPT/
    authority: execution_state
    scope:
      workspace: optiak
      team: OPT
    connectionEndpoint: https://mcp.linear.app/mcp/readonly
  - id: roadmap-ticket-publisher
    status: offline_connector_ready_not_installed
    provider: Linear
    authority: exact_board_approved_issue_creation_only
    scope:
      workspace: optiak
      team: OPT
      actor: product-prd-lead
    implementation: connectors/linear-ticket-publisher
    policy: policies/linear-ticket-publisher.yaml
    restrictions:
      - separate_from_read_only_connection
      - one_create_tool_only
      - exact_action_approval_every_call
      - write_mode_disabled_by_default
      - no_automatic_retry_after_mutation_attempt
      - no_trust_rule
  - id: versioned-api-contract
    status: disconnected
  - id: source-repositories
    status: authorized_pending_connection
    provider: GitHub
    authority: exact_source_revision
    repositories:
      - optiak/optiak
      - optiak/optiak-frontend
      - optiak/iac-infra
    defaultDecision: deny
    connectionEndpoint: https://api.githubcopilot.com/mcp/readonly
    executionWorkspaceContractRef: references/execution-workspace-contract.json
  - id: git-pull-requests
    status: authorized_pending_connection
    provider: GitHub
    authority: exact_pull_request_head_sha_and_available_ci_status_evidence
    repositories:
      - optiak/optiak
      - optiak/optiak-frontend
      - optiak/iac-infra
    installedFor:
      - independent-code-reviewer
    connectionEndpoint: https://api.githubcopilot.com/mcp/readonly
  - id: local-ui-api
    status: observed_pending_approval
    authority: ephemeral_local_evidence_only
    contract: skills/optiak-e2e-validation/references/test-environment-contract.json
    restrictions:
      - exact_loopback_hosts
      - re_probe_before_every_run
      - no_staging_or_release_claim
      - writes_denied
  - id: staging-ui-api
    status: disconnected
  - id: production-observability
    status: disconnected
    authority: runtime_health_only_after_source_specific_smoke
    contract: skills/optiak-incident-triage/references/observability-source-contract.json
    sourceReview:
      - repository: optiak/optiak
        revision: 8bc62279047286eba8a6488d751f680df3cec796
      - repository: optiak/optiak-frontend
        revision: b44db112e4fe08c836e23d8d4362109660b968d8
    restrictions:
      - read_only
      - aggregate_first
      - environment_and_service_scoped
      - missing_or_stale_is_unknown
      - raw_events_logs_and_session_replay_denied
      - no_automatic_oncall_until_signed_alert_tabletop
  - id: brand-design-system
    status: disconnected
