futureAuthorities:
  - id: roadmap-backlog
    status: authorized_pending_connection
    provider: Linear
    url: https://linear.app/optiak/team/OPT/
    authority: execution_state
    scope:
      workspace: optiak
      team: OPT
    connectionEndpoint: https://mcp.linear.app/mcp/readonly
  - id: versioned-api-contract
    status: disconnected
  - id: source-repositories
    status: authorized_pending_connection
    provider: GitHub
    authority: exact_source_revision
    repositories:
      - optiak/optiak
      - optiak/optiak-frontend
    defaultDecision: deny
    connectionEndpoint: https://api.githubcopilot.com/mcp/readonly
  - id: git-pull-requests
    status: authorized_pending_connection
    provider: GitHub
    authority: exact_pull_request_head_sha_and_checks
    repositories:
      - optiak/optiak
      - optiak/optiak-frontend
    installedFor:
      - independent-code-reviewer
    connectionEndpoint: https://api.githubcopilot.com/mcp/readonly
  - id: staging-ui-api
    status: disconnected
  - id: production-observability
    status: disconnected
  - id: brand-design-system
    status: disconnected
